name: "invohub"

services:
  postgres:
    image: postgres:18
    container_name: invohub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # The login the app connects with, created on first start by docker/postgres-init
      DB_APP_USER: ${DB_APP_USER:-invohub_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-invohub_app}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8
    container_name: invohub_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: invohub_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "${MAILPIT_SMTP_PORT}:1025"

  silo:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    container_name: invohub_silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-invohub}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-invohub-local-secret}
    ports:
      - "${STORAGE_PORT:-9100}:9000"
      - "${STORAGE_CONSOLE_PORT:-9101}:9001"
    volumes:
      - silo_data:/data

volumes:
  postgres_data:
  silo_data:
