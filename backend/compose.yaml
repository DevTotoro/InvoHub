name: "invohub"

services:
  postgres:
    image: postgres:18
    container_name: invohub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # The login the app connects with, created on first start by docker/postgres-init
      DB_APP_USER: ${DB_APP_USER:-invohub_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-invohub_app}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8
    container_name: invohub_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: invohub_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "${MAILPIT_SMTP_PORT}:1025"

volumes:
  postgres_data:
