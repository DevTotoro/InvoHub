# Base configuration: production-safe defaults. Connection settings have no defaults here and must be
# provided by the environment (e.g. SPRING_DATASOURCE_URL), so a misconfigured deployment fails fast.
spring:
  application:
    name: backend

  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

  graphql:
    http:
      path: /api/graphql

  session:
    data:
      redis:
        namespace: invohub:session
        # Indexes sessions by user, so locking an account can end all of them (UserService.lockUser).
        # On startup it enables Redis keyspace notifications with CONFIG SET; managed Redis that blocks
        # CONFIG needs configure-action: none and notifications turned on in the provider instead.
        repository-type: indexed

server:
  servlet:
    session:
      # Inactivity timeout: a session ends after a day without requests; each request resets it
      timeout: 1d
      cookie:
        http-only: true
        same-site: lax
        secure: true
