# Base configuration: production-safe defaults. Connection settings have no defaults here and must be
# provided by the environment (e.g. SPRING_DATASOURCE_URL), so a misconfigured deployment fails fast.
spring:
  application:
    name: backend

  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Migrations run as the database owner (spring.flyway.user/password); the app connects with its own
    # login (spring.datasource.username), which the migrations grant only what it needs
    placeholders:
      app_user: ${spring.datasource.username}

  graphql:
    http:
      path: /api/graphql

  servlet:
    multipart:
      # A little above LogoService.MAX_BYTES, so the service decides and says why
      max-file-size: 2MB
      max-request-size: 2MB

  # Texts in the user's language (see Language), e.g. emails. English is the base file, so any other language
  # falls back to it rather than to the server's own locale.
  messages:
    basename: i18n/emails
    fallback-to-system-locale: false

  session:
    data:
      redis:
        namespace: invohub:session
        # The default repository needs no CONFIG, keyspace notifications or PSUBSCRIBE, none of which
        # ElastiCache Serverless allows; RedisUserSessions keeps track of each user's sessions instead
        configure-action: none

logging:
  pattern:
    # Plain-text logs show the request and the signed-in user's public ID; structured (ECS) logs include
    # both as fields anyway. Outside a request, where both are empty, the brackets are left out.
    correlation: "%replace([%X{requestId:-},%X{userId:-}] ){'\\[,\\] ', ''}"

server:
  servlet:
    session:
      # Inactivity timeout: a session ends after 2 hours without requests; each request resets it.
      # Separately, no session outlives invohub.auth.session-max-age (7 days) however active it is.
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax
        secure: true
