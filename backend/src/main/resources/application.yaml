# Base configuration: production-safe defaults. Connection settings have no defaults here and must be
# provided by the environment (e.g. SPRING_DATASOURCE_URL), so a misconfigured deployment fails fast.
spring:
  application:
    name: backend

  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

  graphql:
    http:
      path: /api/graphql

  session:
    data:
      redis:
        namespace: invohub:session

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        secure: true
