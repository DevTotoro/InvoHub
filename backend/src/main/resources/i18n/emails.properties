# Email texts, in English. Greek is in emails_el.properties; keep the keys of both files in step.
# Texts with arguments go through MessageFormat: in those, write a literal ' as ''. Texts without keep a single '.
magic-link.subject=InvoHub - Sign In Link
magic-link.body=Click the link below to sign in to InvoHub:\n\n{0}\n\nThis link will expire in {1}.

duration.hours={0,choice,1#1 hour|1<{0} hours}
duration.minutes={0,choice,1#1 minute|1<{0} minutes}

invitations.subject=InvoHub - Invitation
