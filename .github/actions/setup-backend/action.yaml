name: "Setup BE"
description: "Set up Java with cached Gradle dependencies"

runs:
  using: "composite"
  steps:
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        java-version: "25"
        distribution: "temurin"
        cache: "gradle"
        cache-dependency-path: |
          backend/*.gradle.kts
          backend/gradle/libs.versions.toml
          backend/gradle/wrapper/gradle-wrapper.properties
