name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js & pnpm
        uses: pnpm/setup@v3
        with:
          version: "^12.0.0"
          runtime: "node"
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Svelte Check & Lint
        run: pnpm check && pnpm lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js & pnpm
        uses: pnpm/setup@v3
        with:
          version: "^12.0.0"
          runtime: "node"
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm test:unit -- --run

  build:
    name: Build SvelteKit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js & pnpm
        uses: pnpm/setup@v3
        with:
          version: "^12.0.0"
          runtime: "node"
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js & pnpm
        uses: pnpm/setup@v3
        with:
          version: "^12.0.0"
          runtime: "node"
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: pnpm exec playwright test
