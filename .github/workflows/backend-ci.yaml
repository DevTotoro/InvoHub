name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-check:
    name: Code Quality & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: backend/gradle/libs.versions.toml

      - name: Run Code Checks
        run: ./gradlew check --no-daemon

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: backend/gradle/libs.versions.toml

      - name: Run Tests
        run: ./gradlew test --no-daemon
